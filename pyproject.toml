[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "timelabs"
version = "0.2.0"
description = "Автономное школьное расписание"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.8.3", "ortools==9.12.4544", "argon2-cffi==23.1.0", "openpyxl==3.1.5"]

[project.scripts]
timelabs = "timelabs.ui:main"

[tool.setuptools.packages.find]
include = ["timelabs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
